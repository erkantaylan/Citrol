# Production on Coolify. Set "Docker Compose Location" to /docker-compose.coolify.yml.
# Set in Coolify's env UI: PUBLIC_URL, DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET (and DISCORD_GUILD_ID if wanted).
# SERVICE_USER_POSTGRES and SERVICE_PASSWORD_POSTGRES are generated by Coolify on first deploy.
#
# Users and sessions live in the citrol-db volume. Coolify keeps it across redeploys.
# Never rename the postgres service or the volume: that starts a new, empty database.
services:
  app:
    build: .
    environment:
      PORT: 7421
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL to the https domain}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-citrol}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:7421/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-citrol}
    volumes:
      - citrol-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  citrol-db:
